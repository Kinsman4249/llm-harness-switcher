# litellm_config.yaml
# LOCAL-ONLY proxy config. No cloud model entries, no ANTHROPIC_API_KEY
# anywhere, no fallback. When this proxy is active (see claude-local-toggle.sh)
# every model name Claude Code might send gets mapped to the same local Qwen
# backend. If llama-server isn't serving, requests fail cleanly with a
# connection error, they do not silently fall through to a billed cloud call.
#
# This intentionally means Sonnet/Opus are NOT available while local mode is
# on. That's the tradeoff: local mode is for small, cheap tasks you're happy
# running on a 9B model. For real work (releases, anything needing Sonnet or
# Opus), switch local mode off and Claude Code goes back to your normal Pro
# subscription auth, untouched, same as if this whole setup didn't exist.
#
# Backend is llama-server's OpenAI-compatible endpoint (not Ollama), started
# via start-local-llama.sh, see install.sh/README for the n-cpu-moe, KV
# cache, flash attention, and speculative-decoding flags it launches with.

model_list:
  # litellm_params.model is "openai/<anything>" - the part after "openai/" is
  # never sent to the backend as a real lookup key, llama-server ignores it
  # entirely (it only ever serves the one model it was launched with). Do NOT
  # put "qwen" (or any other real model-family name) in this string: litellm
  # pattern-matches known family names against its own provider registry
  # *before* honoring the explicit "openai/" prefix, which silently rerouted
  # this to the ollama provider (localhost:11434, nothing listening there)
  # instead of the api_base below. Confirmed by testing "openai/qwen-local"
  # (broken, tried to hit ollama) vs "openai/local-llm" (works).
  #
  # One wildcard entry replaces what used to be five near-identical blocks
  # (local-llm, claude-haiku-4-5, claude-haiku-4-5-20251001, claude-sonnet-5,
  # claude-opus-4-8) - LiteLLM matches model_name: "*" against ANY model
  # string the client sends and routes it to this single backend, so a
  # future Claude Code release sending a different string (a new dated ID,
  # for example) no longer needs a new line added here. Confirmed working
  # against LiteLLM 1.93.0 by sending a made-up model name through a test
  # proxy and getting a connection attempt to this api_base back, not a
  # "model not found" error.
  #
  # A wildcard model_name is only safe here specifically because this config
  # has no cloud backend entry at all - there is nothing for an unmatched
  # request to fall through to except this local server, so a typo'd or
  # unexpected model string still can't reach a billed API by accident.
  - model_name: "*"
    litellm_params:
      model: openai/local-llm
      api_base: http://localhost:8080/v1
      api_key: "not-needed"   # llama-server has no auth unless --api-key is passed

general_settings:
  master_key: sk-local-dev-key   # change this; used as ANTHROPIC_AUTH_TOKEN
  # Uncomment to see exactly what model string Claude Code is sending, useful
  # for catching a request that doesn't match any model_name above:
  # log_level: DEBUG
  # log_file: ~/.local/state/litellm-proxy.log
